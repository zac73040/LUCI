<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para alguien especial 💖</title>
<style>
    body {
        background: black;
        color: white;
        text-align: center;
        font-family: Arial;
    }

    #contenido {
        display: none;
    }

    .rosa {
        font-size: 50px;
        animation: crecer 2s infinite alternate;
    }

    @keyframes crecer {
        from { transform: scale(1); }
        to { transform: scale(1.3); }
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-top: 15px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h2>🔒 Acceso privado</h2>
<input type="password" id="pass" placeholder="Ingresa la clave 💌">
<br>
<button onclick="verificar()">Entrar</button>

<div id="contenido">
    <h1>💖 Querida Luciana 💖</h1>

    <div class="rosa">🌹</div>

    <p id="texto"></p>

    <button onclick="verVideo()">Ver sorpresa 🎬</button>

    <audio id="musica" src="musica.mp3"></audio>
</div>

<script>
function verificar() {
    let clave = document.getElementById("pass").value;

    if (clave === "lu123") { // 🔑 cambia la clave aquí
        document.getElementById("contenido").style.display = "block";
        document.body.querySelector("h2").style.display = "none";
        document.getElementById("pass").style.display = "none";

        escribirTexto();
        document.getElementById("musica").play();
    } else {
        alert("Clave incorrecta 😢");
    }
}

function escribirTexto() {
    let texto = "No soy perfecto, pero contigo todo se siente perfecto... 💕\nMe encanta tu sonrisa y la forma en que haces mis días mejores.\n\nEspero te guste esta música que pondré para ti...\nTe la dedico desde mi corazón 💖\nQuerida y linda Lu 💕";
    
    let i = 0;
    let velocidad = 50;
    let elemento = document.getElementById("texto");

    function escribir() {
        if (i < texto.length) {
            elemento.innerHTML += texto.charAt(i);
            i++;
            setTimeout(escribir, velocidad);
        }
    }

    escribir();
}

function verVideo() {
    window.open("video.mp4", "_blank"); // tu video aquí
}
</script>

</body>
</html>
